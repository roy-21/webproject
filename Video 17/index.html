<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <style>
        /* element selector */
        /* div{
            background-color: red;
        } */

        /* class selector */
        .red{
            background-color: red;
        }

        /* id selector */
        #green{
            background-color: green;
        }

        /* chilld selectors */
        div > p{
            color: black;
            background-color: yellow;
        }
        /* descendant selector */
        div p{
            color: white;
            background-color: blue;
        }

        /* universal selector */ */
        * {
            margin: 0;
            padding: 0;
        }

        /* pseudo selectors */
        a:visited{
            color: purple;
        }

        a.link{
            color: green;
        }

        a.active{
            color: red;
        }

        a.hover{
            color: yellow;
        }

        p:first-child{
            background-color: pink;
        }


    </style>
</head>

<body>
    <main class="one">
        <p>This is a paragraph</p>
        <p>This is another paragraph</p>
    </main>
    <div class="red">
        i am a div
        <article>
            <p>I am a pera inside div</p>
        </article>
        
    </div>

    <div id="green">
        i am another div
    </div>
    <a href="https://www.google.com">Go to google</a>
    <a href="https://www.facebook.com">Go to facebook</a>
</body>
</html>
